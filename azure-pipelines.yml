# Azure DevOps multi-stage pipeline: build → push to ACR → deploy to AKS.
trigger:
  branches: { include: [main, release/*] }

variables:
  imageRepo: resumeiq-web
  acrName: acrresumeiq
  azureSubscription: sc-azure-resumeiq
  tag: $(Build.BuildId)

stages:
  - stage: Build
    displayName: Build & Push
    jobs:
      - job: Docker
        pool: { vmImage: ubuntu-latest }
        steps:
          - task: UseNode@1
            inputs: { version: '20.x' }
          - script: |
              curl -fsSL https://bun.sh/install | bash
              export PATH="$HOME/.bun/bin:$PATH"
              bun install --frozen-lockfile
              bun run build
            displayName: Install & Build
          - task: Docker@2
            displayName: Build & Push image to ACR
            inputs:
              containerRegistry: $(acrName)
              repository: $(imageRepo)
              command: buildAndPush
              Dockerfile: Dockerfile
              tags: |
                $(tag)
                latest

  - stage: DeployDev
    displayName: Deploy → dev
    dependsOn: Build
    jobs:
      - deployment: Dev
        environment: resumeiq-dev
        pool: { vmImage: ubuntu-latest }
        strategy:
          runOnce:
            deploy:
              steps:
                - task: KubernetesManifest@1
                  inputs:
                    action: deploy
                    kubernetesServiceConnection: aks-dev
                    namespace: resumeiq-dev
                    manifests: deploy/k8s/overlays/dev/*.yaml
                    containers: $(acrName).azurecr.io/$(imageRepo):$(tag)

  - stage: DeployStage
    displayName: Deploy → stage
    dependsOn: DeployDev
    jobs:
      - deployment: Stage
        environment: resumeiq-stage
        pool: { vmImage: ubuntu-latest }
        strategy:
          runOnce:
            deploy:
              steps:
                - task: KubernetesManifest@1
                  inputs:
                    action: deploy
                    kubernetesServiceConnection: aks-stage
                    namespace: resumeiq-stage
                    manifests: deploy/k8s/overlays/stage/*.yaml
                    containers: $(acrName).azurecr.io/$(imageRepo):$(tag)

  - stage: DeployProd
    displayName: Deploy → prod
    dependsOn: DeployStage
    jobs:
      - deployment: Prod
        environment: resumeiq-prod
        pool: { vmImage: ubuntu-latest }
        strategy:
          runOnce:
            deploy:
              steps:
                - task: KubernetesManifest@1
                  inputs:
                    action: deploy
                    kubernetesServiceConnection: aks-prod
                    namespace: resumeiq-prod
                    manifests: deploy/k8s/overlays/prod/*.yaml
                    containers: $(acrName).azurecr.io/$(imageRepo):$(tag)
