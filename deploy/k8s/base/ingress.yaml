apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resumeiq-web
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts: [app.resumeiq.example.com]
      secretName: resumeiq-tls
  rules:
    - host: app.resumeiq.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: resumeiq-web
                port:
                  number: 80
