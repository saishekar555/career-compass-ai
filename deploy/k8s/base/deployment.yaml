apiVersion: apps/v1
kind: Deployment
metadata:
  name: resumeiq-web
  labels:
    app.kubernetes.io/name: resumeiq-web
    app.kubernetes.io/component: frontend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: resumeiq-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resumeiq-web
    spec:
      containers:
        - name: web
          image: acrresumeiq.azurecr.io/resumeiq-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: resumeiq-config
            - secretRef:
                name: resumeiq-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet: { path: /api/healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /api/healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
