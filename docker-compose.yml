# Local multi-service dev stack for ResumeIQ Enterprise.
# Run: docker compose up --build
services:
  web:
    build:
      context: .
      args:
        APP_VERSION: dev
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: resumeiq
      POSTGRES_PASSWORD: resumeiq
      POSTGRES_DB: resumeiq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
