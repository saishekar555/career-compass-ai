apiVersion: apps/v1
kind: Deployment

metadata:
  name: career-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: career-app

  template:
    metadata:
      labels:
        app: career-app

    spec:
      containers:
      - name: career-app
        image: careeracr12345.azurecr.io/career-app:v1

        ports:
        - containerPort: 8080

---
apiVersion: v1
kind: Service

metadata:
  name: career-service

spec:
  type: LoadBalancer

  selector:
    app: career-app

  ports:
  - port: 80
    targetPort: 8080